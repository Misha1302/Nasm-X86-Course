name: Audit Russian language

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: compilationlab/remediate-self-study-review-2026-07-27

      - name: Collect Latin prose tokens
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          from collections import Counter
          from pathlib import Path
          import re

          root = Path('.')
          changed = {
              'README.md',
              'docs/ai_tutor_eval.md', 'docs/c_abi.md', 'docs/checkpoint_keys.md',
              'docs/checkpoints.md', 'docs/code_patterns.md', 'docs/day_05.md',
              'docs/day_06.md', 'docs/day_07.md', 'docs/day_08.md', 'docs/day_09.md',
              'docs/day_16.md', 'docs/day_17.md', 'docs/day_22.md', 'docs/day_23.md',
              'docs/debug_cards.md', 'docs/how_to_solve_tasks.md',
              'docs/instruction_reference.md', 'docs/patterns/libc_alignment.md',
              'docs/self_study.md', 'docs/transfer_keys.md', 'docs/transfer_workbook.md',
          }

          token_re = re.compile(r"[A-Za-z][A-Za-z0-9_+.-]*")
          inline_code_re = re.compile(r"`[^`]*`")
          link_re = re.compile(r"\[[^\]]*\]\([^)]*\)")
          html_re = re.compile(r"<[^>]+>")
          url_re = re.compile(r"https?://\S+")

          rows: list[str] = []
          counts: Counter[str] = Counter()
          for rel in sorted(changed):
              path = root / rel
              if not path.is_file():
                  continue
              in_fence = False
              for line_no, raw in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  stripped = raw.strip()
                  if stripped.startswith('```'):
                      in_fence = not in_fence
                      continue
                  if in_fence or not stripped or stripped.startswith('<!--'):
                      continue
                  prose = url_re.sub('', raw)
                  prose = link_re.sub('', prose)
                  prose = inline_code_re.sub('', prose)
                  prose = html_re.sub('', prose)
                  tokens = token_re.findall(prose)
                  if not tokens:
                      continue
                  for token in tokens:
                      counts[token.lower()] += 1
                  rows.append(f"{rel}:{line_no}: {', '.join(tokens)} :: {stripped}")

          report = [
              '# Latin words outside code, links and fenced blocks', '',
              '## Frequency',
          ]
          report.extend(f"{token}: {count}" for token, count in counts.most_common())
          report.extend(['', '## Contexts', *rows, ''])
          Path('/tmp/russian-language-audit.txt').write_text('\n'.join(report), encoding='utf-8')
          PY

      - name: Pack current source tree
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=docs/.vitepress/cache --exclude=docs/.vitepress/dist \
            -czf /tmp/nasm-course-language-review.tar.gz .

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: russian-language-audit
          path: /tmp/russian-language-audit.txt

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nasm-course-language-review
          path: /tmp/nasm-course-language-review.tar.gz
