name: Audit course quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install documentation dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate standalone documents
        run: npm run docs:generate

      - name: Validate course structure and contracts
        run: npm run course:validate

      - name: Validate pedagogy and language boundaries
        run: npm run course:pedagogy

      - name: Build VitePress site
        run: npm run docs:build

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: nasm-course-site
          path: docs/.vitepress/dist

      - name: Upload generated learning documents
        uses: actions/upload-artifact@v4
        with:
          name: nasm-course-generated-docs
          path: |
            docs/textbook.md
            docs/course_migration.md
            docs/closed_book_workbook.md
