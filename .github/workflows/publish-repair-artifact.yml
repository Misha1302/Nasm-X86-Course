name: Publish verified repair artifact

on:
  push:
    branches:
      - repair/nasm-course-complete-20260803

permissions:
  actions: read
  contents: write
  statuses: write

concurrency:
  group: publish-verified-repair-artifact
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FINAL_BRANCH: repair/nasm-course-complete-20260803
      BASELINE_SHA: d3a172f12d7a1f7e456a6a930007711a55d8d93c
      ARTIFACT_ID: '8842821995'
      SOURCE_SHA256: d8bb9aeea035e1f677c1e12263cfb197c3c9f2fbe663ac340b0b411946176cce
    steps:
      - name: Mark publisher started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"pending","context":"repair-artifact/publisher","description":"Verified artifact publisher started"}'

      - name: Download and verify source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zip" "$RUNNER_TEMP/source"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/artifact.zip"
          unzip -q "$RUNNER_TEMP/artifact.zip" -d "$RUNNER_TEMP/zip"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/zip/applied-source.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import os, tarfile
          from pathlib import Path, PurePosixPath
          temp = Path(os.environ['RUNNER_TEMP'])
          archive_path = temp / 'zip' / 'applied-source.tar.gz'
          output = temp / 'source'
          with tarfile.open(archive_path, 'r:gz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe archive member: {member.name}')
              archive.extractall(output)
          PY
          test -f "$RUNNER_TEMP/source/scripts/validate_course.py"
          test -f "$RUNNER_TEMP/source/scripts/assessment_contract.json"

      - name: Re-run deterministic proofs
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          python3 scripts/validate_assessment.py
          python3 scripts/run_mutations.py
          python3 scripts/run_adversarial_review.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Publish complete source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, stat, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          branch = os.environ['FINAL_BRANCH']
          baseline = os.environ['BASELINE_SHA']
          source = Path(os.environ['RUNNER_TEMP']) / 'source'
          api_root = f'https://api.github.com/repos/{repo}'

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode()
              request = urllib.request.Request(api_root + path, data=data, method=method, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'verified-repair-publisher',
              })
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'{method} {path}: {error.code}: {error.read().decode(errors="replace")}')

          baseline_commit = api('GET', f'/git/commits/{baseline}')
          tree_sha = baseline_commit['tree']['sha']
          files = sorted(path for path in source.rglob('*') if path.is_file())
          entries = []
          for path in files:
              rel = path.relative_to(source).as_posix()
              mode = '100755' if path.stat().st_mode & stat.S_IXUSR else '100644'
              entries.append({'path': rel, 'mode': mode, 'type': 'blob', 'content': path.read_text(encoding='utf-8')})
          for offset in range(0, len(entries), 30):
              tree = api('POST', '/git/trees', {'base_tree': tree_sha, 'tree': entries[offset:offset+30]})
              tree_sha = tree['sha']

          ref_name = urllib.parse.quote(f'heads/{branch}', safe='/')
          ref = api('GET', f'/git/ref/{ref_name}')
          parent = ref['object']['sha']
          commit = api('POST', '/git/commits', {
              'message': 'fix: enforce semantic course assessment contracts',
              'tree': tree_sha,
              'parents': [parent],
          })
          api('PATCH', f'/git/refs/{ref_name}', {'sha': commit['sha'], 'force': False})
          print(f'FINAL_SHA={commit["sha"]}')
          print(f'FILES_PUBLISHED={len(entries)}')
          PY

      - name: Mark publisher successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"success","context":"repair-artifact/publisher","description":"Complete verified source tree published"}'

      - name: Mark publisher failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"failure","context":"repair-artifact/publisher","description":"Verified artifact publication failed"}' || true
