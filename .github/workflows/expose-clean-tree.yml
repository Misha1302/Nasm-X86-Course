name: Expose clean repair tree

on:
  push:
    branches: [repair/nasm-course-complete-20260803]

permissions:
  contents: read
  statuses: write

jobs:
  expose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish clean tree identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin repair/git-data-full-tree-probe-20260803
          tree_sha="$(git rev-parse 'origin/repair/git-data-full-tree-probe-20260803^{tree}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"success\",\"context\":\"clean-tree/$tree_sha\",\"description\":\"Clean verified repair tree\"}"
