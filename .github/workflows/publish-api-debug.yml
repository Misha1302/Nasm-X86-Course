name: Diagnose Git Data publication

on:
  push:
    branches:
      - repair/nasm-course-complete-20260803

permissions:
  actions: read
  contents: write
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      BASELINE_SHA: d3a172f12d7a1f7e456a6a930007711a55d8d93c
      ARTIFACT_ID: '8842821995'
      SOURCE_SHA256: d8bb9aeea035e1f677c1e12263cfb197c3c9f2fbe663ac340b0b411946176cce
    steps:
      - name: Prepare source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zip" "$RUNNER_TEMP/source"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o "$RUNNER_TEMP/a.zip"
          unzip -q "$RUNNER_TEMP/a.zip" -d "$RUNNER_TEMP/zip"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/zip/applied-source.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zip/applied-source.tar.gz" -C "$RUNNER_TEMP/source"

      - name: Probe Git Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; sha=os.environ['GITHUB_SHA']
          base=os.environ['BASELINE_SHA']; root=Path(os.environ['RUNNER_TEMP'])/'source'
          api_root=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'git-data-probe'}
          def call(method,path,payload=None):
              req=urllib.request.Request(api_root+path,data=None if payload is None else json.dumps(payload).encode(),method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:return json.load(r)
              except urllib.error.HTTPError as e:raise SystemExit(f'{method} {path} {e.code} {e.read().decode(errors="replace")}')
          def status(context,description):
              call('POST',f'/statuses/{sha}',{'state':'success','context':context,'description':description})
          commit=call('GET',f'/git/commits/{base}'); tree_sha=commit['tree']['sha']; status('publisher-api/baseline','Baseline commit and tree resolved')
          candidates=[p for p in sorted(root.rglob('*')) if p.is_file() and not p.relative_to(root).as_posix().startswith('.github/workflows/')]
          first=candidates[0]; rel=first.relative_to(root).as_posix()
          tree=call('POST','/git/trees',{'base_tree':tree_sha,'tree':[{'path':rel,'mode':'100644','type':'blob','content':first.read_text(encoding='utf-8')}]})
          tree_sha=tree['sha']; status('publisher-api/tree-one',f'One-file tree created: {rel[:35]}')
          entries=[]
          for p in candidates[1:21]:
              entries.append({'path':p.relative_to(root).as_posix(),'mode':'100644','type':'blob','content':p.read_text(encoding='utf-8')})
          tree=call('POST','/git/trees',{'base_tree':tree_sha,'tree':entries}); tree_sha=tree['sha']; status('publisher-api/tree-twenty','Twenty-file tree created')
          obj=call('POST','/git/commits',{'message':'probe: do not publish','tree':tree_sha,'parents':[sha]})
          status('publisher-api/commit-object',f'Commit object {obj["sha"][:12]} created')
          PY
