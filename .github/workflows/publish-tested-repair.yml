name: Publish tested NASM course repair

on:
  push:
    branches: [repair/nasm-course-bootstrap-20260803]
    paths: [.github/workflows/publish-tested-repair.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BASELINE_SHA: d3a172f12d7a1f7e456a6a930007711a55d8d93c
      FINAL_BRANCH: repair/nasm-course-complete-20260803
      TESTED_ARTIFACT_ID: '8842821995'
      TESTED_SOURCE_SHA256: d8bb9aeea035e1f677c1e12263cfb197c3c9f2fbe663ac340b0b411946176cce
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download immutable tested source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$TESTED_ARTIFACT_ID/zip" \
            --output /tmp/tested-source.zip
          mkdir /tmp/tested-source
          unzip -q /tmp/tested-source.zip -d /tmp/tested-source
          echo "$TESTED_SOURCE_SHA256  /tmp/tested-source/applied-source.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import tarfile
          from pathlib import PurePosixPath
          path = '/tmp/tested-source/applied-source.tar.gz'
          with tarfile.open(path, 'r:gz') as archive:
              for member in archive.getmembers():
                  item = PurePosixPath(member.name)
                  if item.is_absolute() or '..' in item.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe source member: {member.name}')
          PY

      - name: Materialize exact tested tree on baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C main "$BASELINE_SHA"
          git reset --hard "$BASELINE_SHA"
          git clean -fdx
          tar -xzf /tmp/tested-source/applied-source.tar.gz -C "$GITHUB_WORKSPACE"
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install full validation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib
          python3 -m pip install --disable-pip-version-check playwright==1.54.0
          python3 -m playwright install --with-deps chromium
          npm ci --no-audit --no-fund

      - name: Verify semantic, mutation and executable contracts
        run: |
          npm run docs:generate
          npm run course:validate
          npm run course:pedagogy
          npm run course:assessment
          npm run course:mutation
          python3 scripts/run_adversarial_review.py
          npm run docs:build
          npm run course:asm

      - name: Verify real browser rendering
        run: |
          python3 scripts/serve_built_site.py \
            --root docs/.vitepress/dist \
            --base /Nasm-X86-Course/ \
            --host 127.0.0.1 --port 4173 \
            > /tmp/site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; cat /tmp/site.log' EXIT
          for _ in $(seq 1 60); do
            kill -0 "$server_pid"
            if curl -fsS http://127.0.0.1:4173/Nasm-X86-Course/day_25 >/dev/null; then break; fi
            sleep 1
          done
          python3 scripts/render_vitepress_pages.py \
            --base-url http://127.0.0.1:4173/Nasm-X86-Course/ \
            --output render-evidence/vitepress

      - uses: actions/upload-artifact@v4
        with:
          name: final-vitepress-render-evidence
          path: render-evidence/vitepress
          if-no-files-found: error

      - name: Publish final source branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          rm -rf node_modules docs/.vitepress/cache docs/.vitepress/dist render-evidence/vitepress
          git diff --check
          git checkout -B "$FINAL_BRANCH"
          git add -A
          git commit -m "fix: enforce semantic course assessment contracts"
          final_sha="$(git rev-parse HEAD)"
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" "HEAD:refs/heads/$FINAL_BRANCH"
          printf 'FINAL_BRANCH=%s\nFINAL_SHA=%s\n' "$FINAL_BRANCH" "$final_sha"
