name: Diagnose repair artifact publisher

on:
  push:
    branches:
      - repair/nasm-course-complete-20260803

permissions:
  actions: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: '8842821995'
      SOURCE_SHA256: d8bb9aeea035e1f677c1e12263cfb197c3c9f2fbe663ac340b0b411946176cce
    steps:
      - name: Mark start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"pending","context":"publisher-debug/start","description":"Diagnostic publisher started"}'

      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zip" "$RUNNER_TEMP/source"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/artifact.zip"
          unzip -q "$RUNNER_TEMP/artifact.zip" -d "$RUNNER_TEMP/zip"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/zip/applied-source.tar.gz" | sha256sum -c -
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"success","context":"publisher-debug/download","description":"Artifact and SHA verified"}'

      - name: Extract and inspect source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/zip/applied-source.tar.gz" -C "$RUNNER_TEMP/source"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'source'
          files = [p for p in root.rglob('*') if p.is_file()]
          for path in files:
              path.read_text(encoding='utf-8')
          print(f'FILES={len(files)}')
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"success","context":"publisher-debug/source","description":"Source extracted and UTF-8 verified"}'

      - name: Run deterministic proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          python3 scripts/validate_assessment.py
          python3 scripts/run_mutations.py
          python3 scripts/run_adversarial_review.py
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"success","context":"publisher-debug/proofs","description":"Assessment, mutations and adversarial proofs passed"}'
