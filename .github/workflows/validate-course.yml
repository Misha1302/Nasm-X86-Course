name: Validate course

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lock file
        run: npm ci --no-audit --no-fund
      - name: Generate, validate and build VitePress site
        run: npm run docs:build

  asm-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install NASM and 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib libc6-dev-i386
      - name: Build and verify classified examples
        run: bash scripts/verify_nasm_examples.sh
