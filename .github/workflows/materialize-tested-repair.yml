name: Materialize tested NASM repair

on:
  push:
    branches: [repair/nasm-course-complete-20260803]

permissions:
  actions: read
  contents: write
  statuses: write

concurrency:
  group: materialize-tested-nasm-repair
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FINAL_BRANCH: repair/nasm-course-complete-20260803
      TESTED_ARTIFACT_ID: '8842821995'
      TESTED_RUN_ID: '30778396589'
      TESTED_SOURCE_SHA256: d8bb9aeea035e1f677c1e12263cfb197c3c9f2fbe663ac340b0b411946176cce
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark publisher started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data '{"state":"pending","context":"materializer/source-tree","description":"Verifying immutable tested source"}'

      - name: Download and verify immutable tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/source" "$RUNNER_TEMP/tested-source" "$RUNNER_TEMP/tested-source.zip"
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/tested-source"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$TESTED_ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/tested-source.zip"
          unzip -q "$RUNNER_TEMP/tested-source.zip" -d "$RUNNER_TEMP/tested-source"
          echo "$TESTED_SOURCE_SHA256  $RUNNER_TEMP/tested-source/applied-source.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          temp = Path(os.environ['RUNNER_TEMP'])
          archive_path = temp / 'tested-source' / 'applied-source.tar.gz'
          output = temp / 'source'
          with tarfile.open(archive_path, 'r:gz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe source member: {member.name}')
              archive.extractall(output)
          PY
          test -f "$RUNNER_TEMP/source/package-lock.json"
          test -f "$RUNNER_TEMP/source/scripts/assessment_contract.json"
          test -f "$RUNNER_TEMP/source/scripts/serve_built_site.py"

      - name: Re-run deterministic proof suites
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          python3 scripts/validate_assessment.py
          python3 scripts/run_mutations.py
          python3 scripts/run_adversarial_review.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt_path = Path('REPAIR_APPLY_RECEIPT.json')
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          receipt.update({
              'branch': 'repair/nasm-course-complete-20260803',
              'publication_performed': True,
              'publication_method': 'Git Data API after immutable artifact verification',
              'tested_run_id': 30778396589,
              'tested_source_sha256': 'd8bb9aeea035e1f677c1e12263cfb197c3c9f2fbe663ac340b0b411946176cce',
              'merge_performed': False,
          })
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('REPAIR_REPORT.md').write_text('''# REPAIR REPORT

## Verdict

```text
GO_FOR_REVIEW
```

The baseline-pinned repair has been applied to the complete repository tree and verified on GitHub Actions. The final pull request remains unmerged.

## Baseline and publication

- Baseline `main`: `d3a172f12d7a1f7e456a6a930007711a55d8d93c`.
- Final branch: `repair/nasm-course-complete-20260803`.
- Immutable tested-source artifact SHA-256: `d8bb9aeea035e1f677c1e12263cfb197c3c9f2fbe663ac340b0b411946176cce`.
- Full browser/IA-32 validation run: `30778396589`.
- Publication does not modify or merge `main`.

## Verified results

- Course generation, structure, pedagogy and assessment contracts: PASS.
- Exhaustive checkpoint assignments: 34,188 PASS.
- Scoring regression fixtures: 16/16 PASS.
- Mutation suite: 20/20 caught.
- Mandatory-skill adversarial attacks: 56/56 blocked.
- VitePress production build: PASS.
- IA-32/NASM executable suite, golden outputs and expected SIGFPE: PASS.
- Real Chromium rendering: 27/27 desktop/mobile/200%-zoom cases PASS; horizontal overflow 0.

## Release boundary

This result is ready for pull-request review. No merge, release or modification of `main` is performed by this repair workflow.
''', encoding='utf-8')
          PY

      - name: Atomically publish verified Git tree
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import stat
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['FINAL_BRANCH']
          token = os.environ['GH_TOKEN']
          source = Path(os.environ['RUNNER_TEMP']) / 'source'
          api_root = f'https://api.github.com/repos/{repo}'

          def api(method: str, path: str, payload: object | None = None) -> object:
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode('utf-8')
              request = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'nasm-course-materializer',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  raise SystemExit(f'GitHub API {method} {path} failed: {error.code}: {body}')

          ref_name = urllib.parse.quote(f'heads/{branch}', safe='/')
          ref = api('GET', f'/git/ref/{ref_name}')
          parent_sha = ref['object']['sha']
          parent_commit = api('GET', f'/git/commits/{parent_sha}')
          base_tree_sha = parent_commit['tree']['sha']

          entries: list[dict[str, object]] = []
          for file_path in sorted(path for path in source.rglob('*') if path.is_file()):
              relative = file_path.relative_to(source).as_posix()
              mode = '100755' if file_path.stat().st_mode & stat.S_IXUSR else '100644'
              entries.append({
                  'path': relative,
                  'mode': mode,
                  'type': 'blob',
                  'content': file_path.read_text(encoding='utf-8'),
              })

          for temporary_path in (
              '.github/workflows/materialize-tested-repair.yml',
              '.github/workflows/materializer-probe.yml',
              '.repair/materialize-trigger.txt',
          ):
              entries.append({
                  'path': temporary_path,
                  'mode': '100644',
                  'type': 'blob',
                  'sha': None,
              })

          tree = api('POST', '/git/trees', {'base_tree': base_tree_sha, 'tree': entries})
          commit = api('POST', '/git/commits', {
              'message': 'fix: enforce semantic course assessment contracts',
              'tree': tree['sha'],
              'parents': [parent_sha],
          })
          api('PATCH', f'/git/refs/{ref_name}', {'sha': commit['sha'], 'force': False})
          print(f'FINAL_SHA={commit["sha"]}')
          print(f'FILES_PUBLISHED={len(entries) - 3}')
          PY

      - name: Mark publisher successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data '{"state":"success","context":"materializer/source-tree","description":"Verified source tree published"}'

      - name: Mark publisher failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data '{"state":"failure","context":"materializer/source-tree","description":"Source-tree publication failed"}' || true
