name: Materialize tested NASM repair

on:
  push:
    branches: [repair/nasm-course-complete-20260803]
    paths: [.github/workflows/materialize-tested-repair.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: materialize-tested-nasm-repair
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      FINAL_BRANCH: repair/nasm-course-complete-20260803
      TESTED_ARTIFACT_ID: '8842821995'
      TESTED_SOURCE_SHA256: d8bb9aeea035e1f677c1e12263cfb197c3c9f2fbe663ac340b0b411946176cce
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and verify immutable tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/tested-source" "$RUNNER_TEMP/tested-source.zip"
          mkdir -p "$RUNNER_TEMP/tested-source"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$TESTED_ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/tested-source.zip"
          unzip -q "$RUNNER_TEMP/tested-source.zip" -d "$RUNNER_TEMP/tested-source"
          echo "$TESTED_SOURCE_SHA256  $RUNNER_TEMP/tested-source/applied-source.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/source"
          python3 - <<'PY'
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          runner_temp = Path(os.environ['RUNNER_TEMP'])
          archive_path = runner_temp / 'tested-source' / 'applied-source.tar.gz'
          output = runner_temp / 'source'
          with tarfile.open(archive_path, 'r:gz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe source member: {member.name}')
              archive.extractall(output)
          PY
          test -f "$RUNNER_TEMP/source/package-lock.json"
          test -f "$RUNNER_TEMP/source/scripts/assessment_contract.json"
          test -f "$RUNNER_TEMP/source/scripts/serve_built_site.py"

      - name: Install full validation toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib
          python3 -m pip install --disable-pip-version-check playwright==1.54.0
          python3 -m playwright install --with-deps chromium
          cd "$RUNNER_TEMP/source"
          npm ci --no-audit --no-fund

      - name: Verify semantic, mutation and executable contracts
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          npm run docs:generate
          npm run course:validate
          npm run course:pedagogy
          npm run course:assessment
          npm run course:mutation
          python3 scripts/run_adversarial_review.py
          npm run docs:build
          npm run course:asm

      - name: Verify real browser rendering
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          python3 scripts/serve_built_site.py \
            --root docs/.vitepress/dist \
            --base /Nasm-X86-Course/ \
            --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/site.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/site.log"' EXIT
          for _ in $(seq 1 60); do
            kill -0 "$server_pid"
            if curl -fsS http://127.0.0.1:4173/Nasm-X86-Course/day_25 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/Nasm-X86-Course/final_exam >/dev/null
          python3 scripts/render_vitepress_pages.py \
            --base-url http://127.0.0.1:4173/Nasm-X86-Course/ \
            --output render-evidence/vitepress

      - uses: actions/upload-artifact@v4
        with:
          name: final-source-render-evidence
          path: ${{ runner.temp }}/source/render-evidence/vitepress
          if-no-files-found: error

      - name: Atomically publish verified Git tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/source/node_modules" \
                 "$RUNNER_TEMP/source/docs/.vitepress/cache" \
                 "$RUNNER_TEMP/source/docs/.vitepress/dist" \
                 "$RUNNER_TEMP/source/render-evidence/vitepress"
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import stat
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['FINAL_BRANCH']
          token = os.environ['GH_TOKEN']
          source = Path(os.environ['RUNNER_TEMP']) / 'source'
          api_root = f'https://api.github.com/repos/{repo}'

          def api(method: str, path: str, payload: object | None = None) -> object:
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode('utf-8')
              request = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'nasm-course-materializer',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  raise SystemExit(f'GitHub API {method} {path} failed: {error.code}: {body}')

          ref_name = urllib.parse.quote(f'heads/{branch}', safe='/')
          ref = api('GET', f'/git/ref/{ref_name}')
          parent_sha = ref['object']['sha']
          parent_commit = api('GET', f'/git/commits/{parent_sha}')
          base_tree_sha = parent_commit['tree']['sha']

          entries: list[dict[str, object]] = []
          for file_path in sorted(path for path in source.rglob('*') if path.is_file()):
              relative = file_path.relative_to(source).as_posix()
              mode = '100755' if file_path.stat().st_mode & stat.S_IXUSR else '100644'
              entries.append({
                  'path': relative,
                  'mode': mode,
                  'type': 'blob',
                  'content': file_path.read_text(encoding='utf-8'),
              })

          entries.append({
              'path': '.github/workflows/materialize-tested-repair.yml',
              'mode': '100644',
              'type': 'blob',
              'sha': None,
          })

          tree = api('POST', '/git/trees', {
              'base_tree': base_tree_sha,
              'tree': entries,
          })
          commit = api('POST', '/git/commits', {
              'message': 'fix: enforce semantic course assessment contracts',
              'tree': tree['sha'],
              'parents': [parent_sha],
          })
          api('PATCH', f'/git/refs/{ref_name}', {
              'sha': commit['sha'],
              'force': False,
          })
          print(f'FINAL_BRANCH={branch}')
          print(f'FINAL_SHA={commit["sha"]}')
          print(f'FILES_PUBLISHED={len(entries) - 1}')
          PY
