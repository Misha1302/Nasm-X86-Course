name: Materializer push probe

on:
  push:
    branches: [repair/nasm-course-complete-20260803]

permissions:
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Publish observable push receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data '{"state":"success","context":"materializer/push-event","description":"Final-branch push workflow started"}'
