name: One-shot course repair

on:
  push:
    branches: [fix/course-quality-20260726-impl]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch fix/course-quality-20260726-impl \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install NASM and 32-bit toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm gcc-multilib libc6-dev-i386 >/dev/null

      - name: Patch one-shot script
        working-directory: repo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_course_repairs.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  r'''raise SystemExit("Course validation failed:\n- " + "\n- ".join(errors))''',
                  r'''raise SystemExit("Course validation failed:\\n- " + "\\n- ".join(errors))''',
                  'validator escaping',
              ),
              (
                  r'''re.findall(r'link:\s*"(/[^"]+)"', config)''',
                  r'''re.findall(r'link:\\s*"(/[^"]+)"', config)''',
                  'regex escaping',
              ),
              (
                  'Формула `(a + b - 1) / b` корректна только когда промежуточное `a + b - 1` помещается в 32 бита.',
                  'Промежуточное `a + b - 1` может переполниться. Формула `(a + b - 1) / b` корректна только когда этот результат помещается в 32 бита.',
                  'ceil overflow wording',
              ),
              (
                  'for stem, output in expected.items():\n    write(f"examples/expected/{stem}.txt", output)',
                  'for stem, output in expected.items():\n    target = ROOT / "examples" / "expected" / f"{stem}.txt"\n    target.parent.mkdir(parents=True, exist_ok=True)\n    target.write_text(output, encoding="utf-8")',
                  'empty golden output',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one source match, got {count}')
              text = text.replace(old, new, 1)

          gdb_count = text.count('```gdb')
          if gdb_count == 0:
              raise SystemExit('GDB fence patch: no source matches')
          text = text.replace('```gdb', '```text')

          if 'target.write_text(output, encoding="utf-8")' not in text:
              raise SystemExit('golden output patch did not apply')

          path.write_text(text, encoding='utf-8')
          Path('repair-failure.log').unlink(missing_ok=True)
          PY

      - name: Apply, validate and commit repairs
        working-directory: repo
        env:
          GITHUB_REF_NAME: fix/course-quality-20260726-impl
        run: |
          set +e
          python3 scripts/apply_course_repairs.py > /tmp/course-repair.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/course-repair.log
            cp /tmp/course-repair.log repair-failure.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add repair-failure.log
            git commit -m 'chore: capture course repair failure' || true
            git push origin HEAD:fix/course-quality-20260726-impl || true
            exit "$status"
          fi
