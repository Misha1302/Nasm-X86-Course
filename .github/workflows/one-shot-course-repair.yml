name: One-shot course repair

on:
  push:
    branches: [fix/course-quality-20260726-impl]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch fix/course-quality-20260726-impl \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install NASM and 32-bit toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm gcc-multilib libc6-dev-i386 >/dev/null

      - name: Patch one-shot script
        working-directory: repo
        run: python3 scripts/patch_repair_script.py

      - name: Apply, validate and commit repairs
        working-directory: repo
        env:
          GITHUB_REF_NAME: fix/course-quality-20260726-impl
        run: |
          set +e
          python3 scripts/apply_course_repairs.py > /tmp/course-repair.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/course-repair.log
            cp /tmp/course-repair.log repair-failure.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add repair-failure.log
            git commit -m 'chore: capture course repair failure' || true
            git push origin HEAD:fix/course-quality-20260726-impl || true
            exit "$status"
          fi
