name: Course contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TESTED_COMMIT_SHA: ${{ github.sha }}
  SOURCE_REPOSITORY: ${{ github.repository }}

jobs:
  fast-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate deterministic learning artifacts
        run: python3 scripts/generate_course_docs.py
      - name: Validate semantic contracts
        run: python3 scripts/validate_semantics.py
      - name: Prove assessment constraints and schema ownership
        run: python3 scripts/validate_assessment.py
      - name: Reject malformed assessment input fail-closed
        run: python3 tests/test_assessment_engine.py
      - name: Reject fail-open ASM contract loading
        run: python3 tests/test_nasm_harness.py
      - name: Run adversarial review with independent mutation oracle
        run: python3 scripts/run_adversarial_review.py
      - name: Reject forged mutation evidence and policy replacement
        run: python3 tests/test_evidence_integrity.py
      - name: Test revision provenance binding
        run: python3 tests/test_revision_provenance.py
      - name: Bind contract evidence to source and tested revisions
        run: |
          python3 scripts/bind_evidence_revision.py \
            ASSESSMENT_PROOF.json \
            MUTATION_REPORT.json \
            MUTATION_ORACLE.json \
            ADVERSARIAL_REVIEW.json
      - name: Verify contract evidence revision binding
        run: |
          python3 scripts/verify_evidence_revision.py \
            ASSESSMENT_PROOF.json \
            MUTATION_REPORT.json \
            MUTATION_ORACLE.json \
            ADVERSARIAL_REVIEW.json
      - name: Compile Python validation surface
        run: python3 -m compileall -q scripts tests
      - name: Upload revision-bearing contract evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-evidence
          path: |
            ASSESSMENT_PROOF.json
            MUTATION_REPORT.json
            MUTATION_REPORT.md
            MUTATION_ORACLE.json
            ADVERSARIAL_REVIEW.json
            ADVERSARIAL_REVIEW.md
          if-no-files-found: error

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate closed-book artifacts used by mutations
        run: python3 scripts/generate_course_docs.py
      - name: Run reporting mutation suite
        run: python3 scripts/run_mutations.py
      - name: Independently re-execute mutation policy
        run: python3 scripts/verify_mutation_execution.py
      - name: Bind mutation evidence to source and tested revisions
        run: |
          python3 scripts/bind_evidence_revision.py \
            MUTATION_REPORT.json \
            MUTATION_ORACLE.json
      - name: Verify mutation evidence revision binding
        run: |
          python3 scripts/verify_evidence_revision.py \
            MUTATION_REPORT.json \
            MUTATION_ORACLE.json
      - name: Upload mutation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-evidence
          path: |
            MUTATION_REPORT.json
            MUTATION_REPORT.md
            MUTATION_ORACLE.json
          if-no-files-found: error

  docs-asm-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install IA-32 and browser tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib libc6-dev-i386 curl
          python3 -m pip install --disable-pip-version-check playwright==1.54.0
          python3 -m playwright install --with-deps chromium
      - run: npm ci --no-audit --no-fund
      - run: npm run docs:build
      - run: bash scripts/verify_nasm_examples.sh
      - name: Render real VitePress build
        run: |
          python3 scripts/serve_built_site.py \
            --root docs/.vitepress/dist \
            --base /Nasm-X86-Course/ \
            --host 127.0.0.1 --port 4173 \
            > /tmp/vitepress-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; cat /tmp/vitepress-static.log' EXIT
          for _ in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Built-site server exited before readiness" >&2
              exit 1
            fi
            if curl -fsS http://127.0.0.1:4173/Nasm-X86-Course/day_25 >/dev/null; then
              break
            fi
            sleep 1
          done
          kill -0 "$server_pid"
          curl -fsS http://127.0.0.1:4173/Nasm-X86-Course/final_exam >/dev/null
          python3 scripts/render_vitepress_pages.py \
            --base-url http://127.0.0.1:4173/Nasm-X86-Course/ \
            --output render-evidence/vitepress
      - name: Bind visual evidence to source and tested revisions
        run: |
          python3 scripts/bind_evidence_revision.py \
            render-evidence/vitepress/visual_evidence.json
      - name: Verify visual evidence revision binding
        run: |
          python3 scripts/verify_evidence_revision.py \
            render-evidence/vitepress/visual_evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitepress-render-evidence
          path: render-evidence/vitepress
          if-no-files-found: error
