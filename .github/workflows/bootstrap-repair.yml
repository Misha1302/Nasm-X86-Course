name: Bootstrap NASM course repair

on:
  push:
    branches: [repair/nasm-course-bootstrap-20260803]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    env:
      BASELINE_SHA: d3a172f12d7a1f7e456a6a930007711a55d8d93c
      FINAL_BRANCH: repair/nasm-course-complete-20260803
      BUNDLE_SHA256: 2a97937df8d29199298b7aea1bbb9467825f42d019842de96ec55ff3dc161de8
      DELTA_V2_SHA256: 643905f53d46a7b144ab9c02327e576af5906366e682206a64132c0978cf7329
      DELTA_V3_SHA256: 4e98f55114de961ba68dd6e9f19e28fa8d5e37337a38b914855ac7c5991fa3d3
      DELTA_V4_SHA256: 8208a9e0bcce15047d3e7973dd4669c057f56ef0fabf096b1825325ec65d35d7
      DELTA_V5_SHA256: b63dd5a455e74ffab281d522e2b777549d2d96f74ca61f3e1cfbb65a136eb673
      DELTA_V6_SHA256: 19e2fcfa3ff9526fa85ef6c04974c38fd3f331dadba1f1fc932c412099b95c28
      DELTA_V7_SHA256: 2bd0b1b41a6f14350175129920504bbcaa9d6d8ea88e3405a31f006d0b4f09f0
      DELTA_V8_SHA256: eac75078483cf8d3c2a13cb3162f512088db599900c1aa23f0c7d4092a7be057
      DELTA_V9_SHA256: ec155a12e3b5a7ad72c0a656bff43a8ac34dd79d6e5dbc173d7ba5fb43cb50b2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify repair payloads
        run: |
          cat .repair/parts/part-* | base64 -d > /tmp/bundle.tar.xz
          for version in 2 3 4 5 6 7 8 9; do
            path=".repair/delta/part-*"
            if [ "$version" != 2 ]; then path=".repair/delta-v${version}/part-*"; fi
            cat $path | base64 -d > "/tmp/delta-v${version}.patch.xz"
          done
          echo "$BUNDLE_SHA256  /tmp/bundle.tar.xz" | sha256sum -c -
          for version in 2 3 4 5 6 7 8 9; do
            var="DELTA_V${version}_SHA256"
            echo "${!var}  /tmp/delta-v${version}.patch.xz" | sha256sum -c -
          done
          python3 - <<'PY'
          import tarfile
          from pathlib import PurePosixPath
          with tarfile.open('/tmp/bundle.tar.xz', 'r:xz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe archive member: {member.name}')
              archive.extractall('/tmp')
          PY
          test -f /tmp/nasm-repair-bootstrap-bundle/scripts/apply_repair.py

      - name: Restore exact baseline and apply guarded repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C main "$BASELINE_SHA"
          git reset --hard "$BASELINE_SHA"
          git clean -fdx
          python3 /tmp/nasm-repair-bootstrap-bundle/scripts/apply_repair.py "$GITHUB_WORKSPACE"
          for version in 2 3 4 5 6 7 8 9; do
            xz -dc "/tmp/delta-v${version}.patch.xz" | patch -p1 --batch --forward
          done
          git diff --check
          tar --exclude=.git --exclude=node_modules \
            --exclude='docs/.vitepress/cache' --exclude='docs/.vitepress/dist' \
            -czf /tmp/applied-source.tar.gz .
          sha256sum /tmp/applied-source.tar.gz > /tmp/applied-source.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-applied-source
          path: |
            /tmp/applied-source.tar.gz
            /tmp/applied-source.sha256
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install full validation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib
          python3 -m pip install --disable-pip-version-check playwright==1.54.0
          python3 -m playwright install --with-deps chromium

      - run: npm ci --no-audit --no-fund

      - name: Validate semantic contracts
        run: |
          npm run docs:generate
          npm run course:validate
          npm run course:pedagogy
          npm run course:assessment
          npm run course:mutation
          python3 scripts/run_adversarial_review.py

      - name: Build VitePress and execute IA-32 suite
        run: |
          npm run docs:build
          npm run course:asm

      - name: Render real VitePress build
        id: visual
        run: |
          mkdir -p render-evidence/vitepress/diagnostics
          find docs/.vitepress/dist -maxdepth 2 -type f -printf '%P\n' | sort \
            > render-evidence/vitepress/diagnostics/dist-files.txt
          python3 scripts/serve_built_site.py \
            --root docs/.vitepress/dist \
            --base /Nasm-X86-Course/ \
            --host 127.0.0.1 --port 4173 \
            > /tmp/vitepress-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            if curl -fsS http://127.0.0.1:4173/Nasm-X86-Course/day_25 >/dev/null; then ready=1; break; fi
            sleep 1
          done
          printf 'SERVER_READY=%s\n' "$ready" | tee -a /tmp/render.log
          routes='day_25 final_exam final_exam_keys checkpoints checkpoint_keys transfer_workbook closed_book_workbook day_10 day_10_learning_path'
          for route in $routes; do
            curl -sS -o /tmp/route-body -w "$route HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n" \
              "http://127.0.0.1:4173/Nasm-X86-Course/$route" \
              >> render-evidence/vitepress/diagnostics/routes.txt || true
          done
          set +e
          python3 scripts/render_vitepress_pages.py \
            --base-url http://127.0.0.1:4173/Nasm-X86-Course/ \
            --output render-evidence/vitepress > /tmp/render.log 2>&1
          render_rc=$?
          set -e
          cp /tmp/render.log render-evidence/vitepress/diagnostics/renderer.log || true
          cp /tmp/vitepress-static.log render-evidence/vitepress/diagnostics/server.log || true
          printf 'RENDER_RC=%s\n' "$render_rc" | tee -a render-evidence/vitepress/diagnostics/renderer.log
          cat render-evidence/vitepress/diagnostics/routes.txt
          cat render-evidence/vitepress/diagnostics/renderer.log
          exit "$render_rc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-vitepress-render-diagnostics
          path: render-evidence/vitepress
          if-no-files-found: error

      - name: Publish verified source branch
        run: |
          rm -rf node_modules docs/.vitepress/cache docs/.vitepress/dist render-evidence/vitepress
          git diff --check
          git switch -c "$FINAL_BRANCH"
          git add -A
          git commit -m "fix: enforce semantic course assessment contracts"
          final_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$FINAL_BRANCH"
          printf 'FINAL_BRANCH=%s\nFINAL_SHA=%s\n' "$FINAL_BRANCH" "$final_sha"
