name: Publish verified repair artifact v2

on:
  push:
    branches:
      - repair/nasm-course-complete-20260803

permissions:
  actions: read
  contents: write
  statuses: write

concurrency:
  group: publish-verified-repair-artifact-v2
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FINAL_BRANCH: repair/nasm-course-complete-20260803
      BASELINE_SHA: d3a172f12d7a1f7e456a6a930007711a55d8d93c
      ARTIFACT_ID: '8842821995'
      SOURCE_SHA256: d8bb9aeea035e1f677c1e12263cfb197c3c9f2fbe663ac340b0b411946176cce
    steps:
      - name: Download exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zip" "$RUNNER_TEMP/source"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/artifact.zip"
          unzip -q "$RUNNER_TEMP/artifact.zip" -d "$RUNNER_TEMP/zip"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/zip/applied-source.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zip/applied-source.tar.gz" -C "$RUNNER_TEMP/source"

      - name: Re-run deterministic proofs
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          python3 scripts/validate_assessment.py
          python3 scripts/run_mutations.py
          python3 scripts/run_adversarial_review.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Publish source without workflow paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, stat, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          branch = os.environ['FINAL_BRANCH']
          baseline = os.environ['BASELINE_SHA']
          source = Path(os.environ['RUNNER_TEMP']) / 'source'
          api_root = f'https://api.github.com/repos/{repo}'

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode()
              req = urllib.request.Request(api_root + path, data=data, method=method, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'verified-repair-publisher-v2',
              })
              try:
                  with urllib.request.urlopen(req, timeout=180) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'{method} {path}: {error.code}: {error.read().decode(errors="replace")}')

          base_commit = api('GET', f'/git/commits/{baseline}')
          tree_sha = base_commit['tree']['sha']
          entries = []
          for path in sorted(p for p in source.rglob('*') if p.is_file()):
              rel = path.relative_to(source).as_posix()
              if rel.startswith('.github/workflows/'):
                  continue
              mode = '100755' if path.stat().st_mode & stat.S_IXUSR else '100644'
              entries.append({'path': rel, 'mode': mode, 'type': 'blob', 'content': path.read_text(encoding='utf-8')})
          for offset in range(0, len(entries), 20):
              tree = api('POST', '/git/trees', {'base_tree': tree_sha, 'tree': entries[offset:offset+20]})
              tree_sha = tree['sha']

          ref_name = urllib.parse.quote(f'heads/{branch}', safe='/')
          ref = api('GET', f'/git/ref/{ref_name}')
          parent = ref['object']['sha']
          commit = api('POST', '/git/commits', {
              'message': 'fix: publish verified NASM course source tree',
              'tree': tree_sha,
              'parents': [parent],
          })
          api('PATCH', f'/git/refs/{ref_name}', {'sha': commit['sha'], 'force': False})
          print(f'FINAL_SHA={commit["sha"]}')
          print(f'FILES_PUBLISHED={len(entries)}')
          PY

      - name: Publish success receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"success","context":"repair-artifact/publisher-v2","description":"Verified source tree published; workflows excluded"}'

      - name: Publish failure receipt
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"failure","context":"repair-artifact/publisher-v2","description":"V2 source publication failed"}' || true
