name: Apply self-study contracts

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/self-study-contracts-20260727'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/self-study-contracts-20260727
          fetch-depth: 0

      - name: Apply chapter contracts and regenerate artifacts
        id: apply_contracts
        run: |
          set -o pipefail
          python3 scripts/apply_self_study_contracts.py 2>&1 | tee /tmp/remediation.log
          python3 scripts/generate_course_docs.py 2>&1 | tee -a /tmp/remediation.log
          python3 scripts/validate_course.py 2>&1 | tee -a /tmp/remediation.log
          git diff --check 2>&1 | tee -a /tmp/remediation.log

      - name: Upload remediation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-study-remediation-log
          path: /tmp/remediation.log

      - name: Commit generated remediation and remove transport files
        if: steps.apply_contracts.outcome == 'success'
        run: |
          set -euo pipefail
          rm scripts/apply_self_study_contracts.py
          rm .github/workflows/apply-self-study-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply chapter-level self-study contracts"
          git push origin HEAD:fix/self-study-contracts-20260727
