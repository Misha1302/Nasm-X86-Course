name: Apply self-study contracts

on:
  push:
    branches:
      - fix/self-study-contracts-20260727

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/self-study-contracts-20260727
          fetch-depth: 0

      - name: Apply chapter contracts and regenerate artifacts
        run: |
          set -euo pipefail
          python3 scripts/apply_self_study_contracts.py
          python3 scripts/generate_course_docs.py
          python3 scripts/validate_course.py
          git diff --check

      - name: Commit generated remediation and remove transport files
        run: |
          set -euo pipefail
          rm scripts/apply_self_study_contracts.py
          rm .github/workflows/apply-self-study-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply chapter-level self-study contracts"
          git push origin HEAD:fix/self-study-contracts-20260727
