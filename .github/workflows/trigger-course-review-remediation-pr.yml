name: Trigger course review remediation from PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  trigger:
    if: github.head_ref == 'fix/course-review-remediation-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct, apply and verify patch
        run: |
          set -euo pipefail
          cat .github/remediation/nasm-review-remediation.part00 \
              .github/remediation/nasm-review-remediation.part01 \
              .github/remediation/nasm-review-remediation.part02 \
            | tr -d '\r\n' \
            | base64 -d > /tmp/nasm-review-remediation.patch.xz
          echo '5376cd691694529e3edee8e40f2b90a10f8a1d7c9c124a7d6098fe0fe80ce326  /tmp/nasm-review-remediation.patch.xz' | sha256sum -c -
          xz -dc /tmp/nasm-review-remediation.patch.xz > /tmp/nasm-review-remediation.patch
          echo '3e998bd00acf20ef8673317c3d67e4d0d6d9713b0e214d9322428e6557ed5b50  /tmp/nasm-review-remediation.patch' | sha256sum -c -
          git apply --check /tmp/nasm-review-remediation.patch
          git apply /tmp/nasm-review-remediation.patch
          rm -rf .github/remediation
          rm -f .github/workflows/apply-course-review-remediation.yml
          rm -f .github/workflows/trigger-course-review-remediation-pr.yml
          python3 scripts/generate_course_docs.py
          python3 scripts/validate_course.py
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build docs
        run: |
          npm ci --no-audit --no-fund
          npm run docs:build

      - name: Verify IA-32 examples
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib libc6-dev-i386
          set -euo pipefail
          for file in examples/*.asm; do
            name="$(basename "$file" .asm)"
            nasm -f elf32 -g -F dwarf "$file" -o "/tmp/$name.o"
            gcc -m32 -g -no-pie -Wl,-z,noexecstack "/tmp/$name.o" -o "/tmp/$name"
            "/tmp/$name" > "/tmp/$name.out"
            diff -u "examples/expected/$name.txt" "/tmp/$name.out"
          done

      - name: Commit verified remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix course review findings and strengthen validation'
          git push origin HEAD:${{ github.head_ref }}
