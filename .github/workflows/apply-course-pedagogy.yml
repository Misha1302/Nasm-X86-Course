name: Apply course pedagogy patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.course-pedagogy/**'
      - '.github/workflows/apply-course-pedagogy.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v4
        with:
          ref: fix/course-pedagogy-20260726
          fetch-depth: 1
          show-progress: false

      - name: Prepare payload workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .work-course-pedagogy
          mkdir .work-course-pedagogy

      - name: Verify staged payload files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .course-pedagogy/part-00 \
            .course-pedagogy/seg-00 \
            .course-pedagogy/seg-01 \
            .course-pedagogy/seg-02 \
            .course-pedagogy/seg-03a \
            .course-pedagogy/seg-03b \
            .course-pedagogy/seg-03c \
            .course-pedagogy/seg-04 \
            .course-pedagogy/seg-05
          do
            test -f "$file"
            printf '%s %s bytes\n' "$file" "$(wc -c < "$file")"
          done

      - name: Assemble encoded payload
        shell: bash
        run: |
          set -euo pipefail
          output=.work-course-pedagogy/patch.xz.b64
          : > "$output"
          for file in \
            .course-pedagogy/part-00 \
            .course-pedagogy/seg-00 \
            .course-pedagogy/seg-01 \
            .course-pedagogy/seg-02 \
            .course-pedagogy/seg-03a \
            .course-pedagogy/seg-03b \
            .course-pedagogy/seg-03c \
            .course-pedagogy/seg-04 \
            .course-pedagogy/seg-05
          do
            tr -d '\r\n' < "$file" >> "$output"
          done
          wc -c "$output"

      - name: Verify compressed payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .work-course-pedagogy/patch.xz.b64 > .work-course-pedagogy/patch.xz
          echo 'b296e0be0b99bff0ebc5f796681983a98c8d51e8922335603f5e8793c766d51c  .work-course-pedagogy/patch.xz' | sha256sum --check -

      - name: Verify decompressed patch
        shell: bash
        run: |
          set -euo pipefail
          xz --decompress --stdout .work-course-pedagogy/patch.xz > .work-course-pedagogy/patch
          echo '7962939bcd8e9d69dd6a4dfb71127c1678cc5b6f3a4a2af3f90749067c5e0415  .work-course-pedagogy/patch' | sha256sum --check -

      - name: Check and apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .work-course-pedagogy/patch
          git apply .work-course-pedagogy/patch

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install documentation dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate, validate and build documentation
        run: npm run docs:build

      - name: Install IA-32 example toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib libc6-dev-i386

      - name: Build and verify executable examples
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/*.asm; do
            name="$(basename "$file" .asm)"
            nasm -f elf32 -g -F dwarf "$file" -o ".work-course-pedagogy/$name.o"
            gcc -m32 -g -no-pie -Wl,-z,noexecstack ".work-course-pedagogy/$name.o" -o ".work-course-pedagogy/$name"
            ".work-course-pedagogy/$name" > ".work-course-pedagogy/$name.out"
            diff -u "examples/expected/$name.txt" ".work-course-pedagogy/$name.out"
          done

      - name: Commit verified course revision
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .work-course-pedagogy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs scripts
          git diff --cached --check
          git commit -m 'Improve course pedagogy and learning flow'
          git push origin HEAD:fix/course-pedagogy-20260726
