name: Apply course pedagogy patch

on:
  push:
    branches:
      - fix/course-pedagogy-20260726
    paths:
      - '.course-pedagogy/**'
      - '.github/workflows/apply-course-pedagogy.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.course-pedagogy/**'
      - '.github/workflows/apply-course-pedagogy.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v4
        with:
          ref: fix/course-pedagogy-20260726
          fetch-depth: 0

      - name: Assemble encoded payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .course-pedagogy/part-00 \
            .course-pedagogy/seg-00 \
            .course-pedagogy/seg-01 \
            .course-pedagogy/seg-02 \
            .course-pedagogy/seg-03a \
            .course-pedagogy/seg-03b \
            .course-pedagogy/seg-03c \
            .course-pedagogy/seg-04 \
            .course-pedagogy/seg-05 \
            | tr -d '\r\n' > /tmp/course-pedagogy.patch.xz.b64
          echo "encoded payload bytes: $(wc -c < /tmp/course-pedagogy.patch.xz.b64)"

      - name: Verify compressed payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/course-pedagogy.patch.xz.b64 > /tmp/course-pedagogy.patch.xz
          sha256sum /tmp/course-pedagogy.patch.xz
          echo 'b296e0be0b99bff0ebc5f796681983a98c8d51e8922335603f5e8793c766d51c  /tmp/course-pedagogy.patch.xz' | sha256sum --check -

      - name: Verify decompressed patch
        shell: bash
        run: |
          set -euo pipefail
          xz --decompress --stdout /tmp/course-pedagogy.patch.xz > /tmp/course-pedagogy.patch
          sha256sum /tmp/course-pedagogy.patch
          echo '7962939bcd8e9d69dd6a4dfb71127c1678cc5b6f3a4a2af3f90749067c5e0415  /tmp/course-pedagogy.patch' | sha256sum --check -

      - name: Check and apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/course-pedagogy.patch
          git apply /tmp/course-pedagogy.patch

      - name: Remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .course-pedagogy
          rm -f .github/workflows/apply-course-pedagogy.yml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install documentation dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate, validate and build documentation
        run: npm run docs:build

      - name: Install IA-32 example toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib libc6-dev-i386

      - name: Build and verify executable examples
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/*.asm; do
            name="$(basename "$file" .asm)"
            nasm -f elf32 -g -F dwarf "$file" -o "/tmp/$name.o"
            gcc -m32 -g -no-pie -Wl,-z,noexecstack "/tmp/$name.o" -o "/tmp/$name"
            "/tmp/$name" > "/tmp/$name.out"
            diff -u "examples/expected/$name.txt" "/tmp/$name.out"
          done

      - name: Commit verified course revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Improve course pedagogy and learning flow'
          git push origin HEAD:fix/course-pedagogy-20260726
