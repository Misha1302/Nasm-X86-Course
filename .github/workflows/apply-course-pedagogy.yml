name: Apply course pedagogy patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.course-pedagogy/**'
      - '.github/workflows/apply-course-pedagogy.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v4
        with:
          ref: fix/course-pedagogy-20260726
          fetch-depth: 0
          show-progress: false

      - name: Assemble encoded payload
        shell: bash
        run: |
          set +e
          work_dir="$RUNNER_TEMP/course-pedagogy"
          mkdir -p "$work_dir"
          WORK_DIR="$work_dir" python3 - <<'PY' > "$work_dir/assembly.log" 2>&1
          import os
          from pathlib import Path

          paths = [
              '.course-pedagogy/part-00',
              '.course-pedagogy/seg-00',
              '.course-pedagogy/seg-01',
              '.course-pedagogy/seg-02',
              '.course-pedagogy/seg-03a',
              '.course-pedagogy/seg-03b',
              '.course-pedagogy/seg-03c',
              '.course-pedagogy/seg-04',
              '.course-pedagogy/seg-05',
          ]
          parts = []
          for raw_path in paths:
              text = Path(raw_path).read_text(encoding='ascii').replace('\r', '').replace('\n', '')
              print(f'{raw_path}: {len(text)} bytes')
              parts.append(text)
          payload = ''.join(parts)
          output = Path(os.environ['WORK_DIR']) / 'patch.xz.b64'
          output.write_text(payload, encoding='ascii')
          print(f'encoded payload bytes: {len(payload)}')
          PY
          status=$?
          cat "$work_dir/assembly.log"
          exit "$status"

      - name: Persist assembly diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/course-pedagogy/assembly.log" .course-pedagogy/diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .course-pedagogy/diagnostic.txt
          git commit -m 'chore: record pedagogy payload diagnostic'
          git push origin HEAD:fix/course-pedagogy-20260726

      - name: Verify compressed payload
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/course-pedagogy"
          base64 --decode "$work_dir/patch.xz.b64" > "$work_dir/patch.xz"
          sha256sum "$work_dir/patch.xz"
          echo "b296e0be0b99bff0ebc5f796681983a98c8d51e8922335603f5e8793c766d51c  $work_dir/patch.xz" | sha256sum --check -

      - name: Verify decompressed patch
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/course-pedagogy"
          xz --decompress --stdout "$work_dir/patch.xz" > "$work_dir/patch"
          sha256sum "$work_dir/patch"
          echo "7962939bcd8e9d69dd6a4dfb71127c1678cc5b6f3a4a2af3f90749067c5e0415  $work_dir/patch" | sha256sum --check -

      - name: Check and apply patch
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/course-pedagogy/patch"
          git apply --check "$patch_file"
          git apply "$patch_file"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install documentation dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate, validate and build documentation
        run: npm run docs:build

      - name: Install IA-32 example toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib libc6-dev-i386

      - name: Build and verify executable examples
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/*.asm; do
            name="$(basename "$file" .asm)"
            nasm -f elf32 -g -F dwarf "$file" -o "$RUNNER_TEMP/$name.o"
            gcc -m32 -g -no-pie -Wl,-z,noexecstack "$RUNNER_TEMP/$name.o" -o "$RUNNER_TEMP/$name"
            "$RUNNER_TEMP/$name" > "$RUNNER_TEMP/$name.out"
            diff -u "examples/expected/$name.txt" "$RUNNER_TEMP/$name.out"
          done

      - name: Commit verified course revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs scripts
          git diff --cached --check
          git commit -m 'Improve course pedagogy and learning flow'
          git push origin HEAD:fix/course-pedagogy-20260726
