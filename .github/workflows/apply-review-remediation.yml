name: Apply review remediation

on:
  push:
    branches:
      - compilationlab/remediate-self-study-review-2026-07-27
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: compilationlab/remediate-self-study-review-2026-07-27
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic remediation
        id: remediation
        shell: bash
        run: |
          set +e
          python3 scripts/prepare_review_remediation.py > /tmp/remediation.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python3 scripts/apply_review_remediation.py >> /tmp/remediation.log 2>&1
            status=$?
          fi
          echo "$status" > /tmp/remediation.status
          cat /tmp/remediation.log
          exit 0

      - name: Upload remediation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-diagnostics
          path: |
            /tmp/remediation.log
            /tmp/remediation.status
          if-no-files-found: error

      - name: Stop on remediation failure
        run: |
          status="$(cat /tmp/remediation.status)"
          if [ "$status" -ne 0 ]; then
            cat /tmp/remediation.log
            exit "$status"
          fi

      - name: Generate and validate course
        run: |
          set -euo pipefail
          python3 scripts/generate_course_docs.py
          python3 -m py_compile scripts/*.py
          python3 scripts/validate_course.py
          git diff --check

      - name: Build documentation
        run: |
          npm ci --no-audit --no-fund
          npm run docs:build

      - name: Install IA-32 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib libc6-dev-i386

      - name: Build and execute examples
        run: |
          set -euo pipefail
          for file in examples/*.asm; do
            name="$(basename "$file" .asm)"
            nasm -f elf32 -g -F dwarf "$file" -o "/tmp/$name.o"
            gcc -m32 -g -no-pie -Wl,-z,noexecstack "/tmp/$name.o" -o "/tmp/$name"
            "/tmp/$name" > "/tmp/$name.out"
            diff -u "examples/expected/$name.txt" "/tmp/$name.out"
          done

      - name: Commit only final repository changes
        run: |
          set -euo pipefail
          rm -f scripts/apply_review_remediation.py scripts/prepare_review_remediation.py .github/workflows/apply-review-remediation.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No remediation changes produced"
            exit 1
          fi
          git config user.name "CompilationLab Remediation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix ABI, assessment and semantic validation gaps"
          git push origin HEAD:compilationlab/remediate-self-study-review-2026-07-27
